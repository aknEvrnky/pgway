name: Bug report
description: Something is broken or behaves incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Prefer `pgctl` / gRPC repros over the experimental dashboard when possible.
        Redact tokens, passwords, and private proxy credentials.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or YAML (sanitized).
      placeholder: |
        1. make build && ./build/pgway -config config.yml
        2. pgctl apply -f ...
        3. curl ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant log lines if you have them.
    validations:
      required: true

  - type: dropdown
    id: binary
    attributes:
      label: Binary / mode
      options:
        - pgway (all-in-one)
        - pgway-cp + pgway-dp (distributed)
        - pgctl only
        - Unsure
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version` (or “prebuilt binary”).
      placeholder: go version go1.27.1 darwin/arm64
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, how you built (commit SHA / `make build`), notable config keys (no secrets).
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I redacted secrets from logs and config
          required: true
