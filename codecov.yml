# Codecov configuration.
# Entrypoints (cmd/*/main.go) are composition roots — pure wiring with no
# branching logic — and generated code is not hand-written; neither is
# meaningful to cover, so both are excluded from coverage reporting.
ignore:
  - "cmd/**"
  - "gen/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 60%
        threshold: 5%
