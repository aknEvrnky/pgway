syntax = "proto3";
package pgway.controlplane.v1;
option go_package = "github.com/aknEvrnky/pgway/gen/pgway/controlplane/v1;controlplanev1";

import "google/protobuf/timestamp.proto";

message AgentInfo {
  string name = 1;
  string hostname = 2;
  string version = 3;
  map<string, string> labels = 4;
}

message Agent {
  AgentInfo info = 1;
  string status = 2;
  google.protobuf.Timestamp last_heartbeat = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreateRegistrationTokenRequest {
  // 0 means the server default registration_token_ttl
  int64 ttl_seconds = 1;
}

message CreateRegistrationTokenResponse {
  string registration_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RegisterRequest {
  string registration_token = 1;
  AgentInfo info = 2;
}

message RegisterResponse {
  string agent_id = 1;
  string agent_token = 2;
  google.protobuf.Timestamp token_expires_at = 3;
}

message HeartbeatRequest {}

message HeartbeatResponse {
  google.protobuf.Timestamp token_expires_at = 1;
}

message DeregisterRequest {}

message DeregisterResponse {}

message ListAgentsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string search = 3;
  map<string, string> labels = 4;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message DeleteAgentRequest {
  string name = 1;
}

message DeleteAgentResponse {}

service AgentService {
  rpc CreateRegistrationToken(CreateRegistrationTokenRequest) returns (CreateRegistrationTokenResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
}
