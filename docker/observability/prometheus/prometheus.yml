global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    # Keep OTLP-derived job label (service.name) instead of overwriting it
    # with this scrape job's name (pgway / pgway-cp / pgway-dp distinction).
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
