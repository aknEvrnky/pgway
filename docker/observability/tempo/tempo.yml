# Tempo monolithic, no-dependencies mode for local tracing.
# OTLP received inside the compose network only (the collector forwards);
# the HTTP API (:3200) is published for queries and /ready.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces

usage_report:
  reporting_enabled: false
